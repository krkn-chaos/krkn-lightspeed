name: Build Lightspeed FAISS RAG Containers

on:
  pull_request:
    paths:
      - 'containers/assist-rag/**'
      - '.github/workflows/build-assist-rag-containers.yaml'
  push:
    tags:
      - 'v*'

env:
  REGISTRY: quay.io
  IMAGE_NAME: krkn-chaos/krknctl-assist

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push AMD64 container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/assist-rag/Containerfile.amd64
          platforms: linux/amd64
          push: ${{ steps.version.outputs.is_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-amd64-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ARM64 container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/assist-rag/Containerfile.arm64
          platforms: linux/arm64
          push: ${{ steps.version.outputs.is_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-arm64-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.ref_type == 'tag'
    steps:
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Create multi-arch manifest with both amd64 and arm64
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-${VERSION} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-amd64-${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-arm64-${VERSION}

          echo "Multi-arch manifest created successfully"
          echo "Available tags:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-${VERSION}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:faiss-latest"
          echo ""
          echo "Architectures: linux/amd64, linux/arm64"
